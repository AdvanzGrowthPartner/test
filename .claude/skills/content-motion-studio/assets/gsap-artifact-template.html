<!--
  GSAP + Simple Icons standalone artifact template.
  - GSAP + ScrollTrigger load from cdnjs (the only script CDN allowed inside claude.ai artifacts).
  - Brand icons are inlined as <svg> (generate them with scripts/icon.mjs <slug>).
  - Self-contained: paste the whole file as an HTML artifact, no build step.
  Replace TEXT_*, the icon paths, and the palette. Keep it opinionated — avoid the
  centered-everything / purple-gradient / uniform-rounded-corner "AI slop" default.
-->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Motion Artifact</title>
<style>
  :root {
    --bg: #0b0b0f; --ink: #f5f5f4; --muted: #9aa0aa;
    --accent: #7ab55c; --line: #23232b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Space Grotesk", "Segoe UI", system-ui, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: clamp(24px, 5vw, 72px); }
  .eyebrow { text-transform: uppercase; letter-spacing: .28em; font-size: 13px;
    color: var(--accent); font-weight: 700; }
  h1 { font-size: clamp(40px, 8vw, 108px); line-height: .96; font-weight: 800;
    letter-spacing: -.03em; margin: 18px 0 0; }
  h1 .word { display: inline-block; will-change: transform; }
  .lead { color: var(--muted); font-size: clamp(18px, 2.4vw, 26px); max-width: 46ch;
    margin: 28px 0 0; }
  .rule { height: 6px; width: 0; background: var(--accent); border-radius: 3px; margin: 40px 0; }
  .marquee { display: flex; gap: 40px; align-items: center; overflow: hidden;
    border-block: 1px solid var(--line); padding: 26px 0; }
  .marquee svg { height: 40px; width: 40px; flex: 0 0 auto; opacity: .85; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 1px; background: var(--line); border: 1px solid var(--line); margin-top: 64px; }
  .card { background: var(--bg); padding: 32px; }
  .card:nth-child(2n) { background: #101018; }
  .card h3 { margin: 14px 0 6px; font-size: 22px; }
  .card p { color: var(--muted); margin: 0; font-size: 16px; line-height: 1.5; }
  .reveal { opacity: 0; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow reveal">TEXT_EYEBROW</div>
    <h1 aria-label="TEXT_HEADLINE"><span class="word">Content</span> <span class="word">que</span> <span class="word">se</span> <span class="word">mueve</span></h1>
    <p class="lead reveal">TEXT_LEAD — cámbialo por tu propuesta de valor.</p>
    <div class="rule" id="rule"></div>
  </div>

  <!-- Brand marquee. Swap these for icons from: node scripts/icon.mjs <slug> -->

    <svg viewBox="0 0 24 24" fill="#0866FF"><title>Meta</title><path d="M6.915 4.03c-1.968 0-3.683 1.28-4.871 3.113C.704 9.208 0 11.883 0 14.449c0 .706.07 1.369.21 1.973a6.624 6.624 0 0 0 .265.86 5.297 5.297 0 0 0 .371.761c.696 1.159 1.818 1.927 3.593 1.927 1.497 0 2.633-.671 3.965-2.444.76-1.012 1.144-1.626 2.663-4.32l.756-1.339.186-.325c.061.1.121.196.183.294l2.152 3.595c.724 1.21 1.665 2.556 2.47 3.314 1.046.987 1.992 1.22 3.06 1.22 1.075 0 1.876-.355 2.455-.843a3.743 3.743 0 0 0 .81-.973c.542-.939.861-2.127.861-3.745 0-2.72-.681-5.357-2.084-7.45-1.282-1.912-2.957-2.93-4.716-2.93-1.047 0-2.088.467-3.053 1.308-.652.57-1.257 1.29-1.82 2.05-.69-.875-1.335-1.547-1.958-2.056-1.182-.966-2.315-1.303-3.454-1.303z"/></svg>
  </div>

  <div class="wrap">
    <div class="grid">
      <div class="card reveal"><h3>TEXT_CARD1_TITLE</h3><p>TEXT_CARD1_BODY</p></div>
      <div class="card reveal"><h3>TEXT_CARD2_TITLE</h3><p>TEXT_CARD2_BODY</p></div>
      <div class="card reveal"><h3>TEXT_CARD3_TITLE</h3><p>TEXT_CARD3_BODY</p></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
  <script>
    gsap.registerPlugin(ScrollTrigger);

    // Hero: staggered word entrance + accent rule wipe.
    const tl = gsap.timeline({ defaults: { ease: "power4.out" } });
    tl.from(".word", { yPercent: 120, opacity: 0, duration: 0.9, stagger: 0.08 })
      .from(".eyebrow", { y: 20, opacity: 0, duration: 0.6 }, "-=0.6")
      .from(".lead", { y: 20, opacity: 0, duration: 0.6 }, "-=0.4")
      .to("#rule", { width: 220, duration: 0.7 }, "-=0.2")
      .to(".eyebrow, .lead", { opacity: 1 }, 0);

    // Infinite brand marquee.
    gsap.to("#marquee", { xPercent: -8, repeat: -1, yoyo: true, duration: 6, ease: "sine.inOut" });

    // Scroll-triggered card reveals.
    gsap.utils.toArray(".grid .reveal").forEach((el, i) => {
      gsap.to(el, {
        opacity: 1, y: 0, duration: 0.7, ease: "power2.out",
        scrollTrigger: { trigger: el, start: "top 85%" },
        delay: i * 0.05,
      });
      gsap.set(el, { y: 30 });
    });
  </script>
</body>
</html>
