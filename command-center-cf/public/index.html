/* ---------- helpers ---------- */
const NF=n=>Math.round(n).toLocaleString('es-CL');
const scoreColor=s=>s>=67?'var(--green)':s>=45?'var(--amber)':'var(--red)';
const scoreCls=s=>s>=67?'g':s>=45?'y':'r';
function ring(s,size){size=size||64;const r=size/2-6,C=2*Math.PI*r,off=C*(1-s/100),col=scoreColor(s);
 return `<div class="ring" style="width:${size}px;height:${size}px"><svg viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#eeecf6" stroke-width="6"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/></svg><div class="lbl"><b>${s}</b><span>SCORE</span></div></div>`;}
function stacked(months,a,b,ca,cb){const w=560,h=200,pl=32,pb=32,pt=14,pr=10,iw=w-pl-pr,ih=h-pt-pb;
 const tot=months.map(m=>(a[m]||0)+(b[m]||0)),mx=Math.max(...tot)*1.15||1,n=months.length,gw=iw/n,bw=Math.min(46,gw*0.5);
 let o=`<svg viewBox="0 0 ${w} ${h}" width="100%">`;
 for(let g=0;g<=mx;g+=Math.ceil(mx/4)){const y=pt+ih-(g/mx*ih);o+=`<line x1="${pl}" y1="${y}" x2="${w-pr}" y2="${y}" stroke="#eeecf6"/><text x="${pl-6}" y="${y+3}" text-anchor="end" font-size="9" fill="#6b6580">${g}</text>`;}
 months.forEach((m,i)=>{const x=pl+i*gw+gw/2-bw/2,ha=(a[m]||0)/mx*ih,hb=(b[m]||0)/mx*ih,yb=pt+ih;
  o+=`<rect x="${x}" y="${yb-ha}" width="${bw}" height="${ha}" rx="3" fill="${ca}"/><rect x="${x}" y="${yb-ha-hb-1.5}" width="${bw}" height="${Math.max(hb,1)}" rx="3" fill="${cb}"/>`;
  o+=`<text x="${x+bw/2}" y="${yb-ha-hb-7}" text-anchor="middle" class="sg" font-size="10" font-weight="700" fill="#12101a">${tot[i].toFixed(1)}</text><text x="${x+bw/2}" y="${h-pb+15}" text-anchor="middle" font-size="10" fill="#6b6580">${CC.mlabel[m]}</text>`;});
 return o+`</svg>`;}
function bars(months,vals,hi){const w=560,h=190,pl=40,pb=30,pt=14,pr=10,iw=w-pl-pr,ih=h-pt-pb;
 const mx=Math.max(...months.map(m=>vals[m]||0))*1.15||1,n=months.length,gw=iw/n,bw=Math.min(46,gw*0.5);
 let o=`<svg viewBox="0 0 ${w} ${h}" width="100%">`;
 for(let g=0;g<=mx;g+=Math.ceil(mx/4/100)*100){const y=pt+ih-(g/mx*ih);o+=`<line x1="${pl}" y1="${y}" x2="${w-pr}" y2="${y}" stroke="#eeecf6"/><text x="${pl-6}" y="${y+3}" text-anchor="end" font-size="9" fill="#6b6580">${NF(g)}</text>`;}
 months.forEach((m,i)=>{const x=pl+i*gw+gw/2-bw/2,bh=(vals[m]||0)/mx*ih,y=pt+ih-bh,c=m===hi?'#0891b2':'#c9b8ef';
  o+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="3" fill="${c}"/><text x="${x+bw/2}" y="${y-5}" text-anchor="middle" class="sg" font-size="10" font-weight="700" fill="#12101a">${NF(vals[m]||0)}</text><text x="${x+bw/2}" y="${h-pb+15}" text-anchor="middle" font-size="10" fill="#6b6580">${CC.mlabel[m]}</text>`;});
 return o+`</svg>`;}
function funnel(steps){const w=560,h=240,cx=w/2,top=12,band=44,gap=12,mxw=360,mx=steps[0][1]||1;
 const wd=v=>Math.max(mxw*Math.pow(v/mx,0.5),60),cols=['#0891b2','#3aa8c9','#7bc6da','#b5e0ea'];
 let o=`<svg viewBox="0 0 ${w} ${h}" width="100%">`,y=top;
 steps.forEach((s,i)=>{const w1=wd(s[1]),w2=i+1<steps.length?wd(steps[i+1][1]):w1*0.55,x1=cx-w1/2,x2=cx-w2/2,yb=y+band;
  o+=`<polygon points="${x1},${y} ${x1+w1},${y} ${x2+w2},${yb} ${x2},${yb}" fill="${cols[i]}"/><text x="${cx}" y="${y+band/2-1}" text-anchor="middle" class="sg" font-size="15" font-weight="700" fill="#fff">${NF(s[1])}</text><text x="${cx+w1/2+10}" y="${y+band/2+4}" font-size="11.5" font-weight="600" fill="#12101a">${s[0]}</text>`;y=yb+gap;});
 return o+`</svg>`;}
const kpiRow=k=>`<div class="kgrid">`+k.map(x=>`<div class="kpi ${x.d==='pend'?'pend':''}"><div class="l">${x.l}</div><div class="v">${x.v}</div><div class="d ${x.d==='pend'?'nt':x.d}">${x.s||''}</div></div>`).join('')+`</div>`;
const dimBars=d=>`<div class="dims">`+d.map(x=>`<div class="dim"><span class="dl">${x[0]}</span><div class="dt"><div class="df" style="width:${x[1]}%;background:${scoreColor(x[1])}"></div></div><span class="dv">${x[1]}</span></div>`).join('')+`</div>`;

 let o=`<table class="dtbl"><thead><tr>`+head.map((h,i)=>`<th class="${align[i]==='r'?'r':''}">${h}</th>`).join('')+`</tr></thead><tbody>`;

function gscTrend(monthly){const w=560,h=210,pl=40,pr=40,pt=16,pb=28,iw=w-pl-pr,ih=h-pt-pb;
 const imx=Math.max(...monthly.map(m=>m[2]))*1.15||1,cmx=Math.max(...monthly.map(m=>m[1]))*1.3||1,n=monthly.length,gw=iw/n,bw=Math.min(34,gw*0.55);
 let o=`<svg viewBox="0 0 ${w} ${h}" width="100%">`;
 for(let g=0;g<=imx;g+=Math.ceil(imx/4/1000)*1000){const y=pt+ih-(g/imx*ih);o+=`<line x1="${pl}" y1="${y}" x2="${w-pr}" y2="${y}" stroke="#eeecf6"/><text x="${pl-6}" y="${y+3}" text-anchor="end" font-size="9" fill="#6b6580">${g>=1000?(g/1000)+'k':g}</text>`;}
 let pts=[];
 monthly.forEach((m,i)=>{const cx=pl+i*gw+gw/2,bh=(m[2]/imx*ih),y=pt+ih-bh;
  o+=`<rect x="${cx-bw/2}" y="${y}" width="${bw}" height="${bh}" rx="3" fill="#c9b8ef"/>`;
  o+=`<text x="${cx}" y="${h-pb+15}" text-anchor="middle" font-size="10" fill="#6b6580">${m[0]}</text>`;
  pts.push([cx,pt+ih-(m[1]/cmx*ih)]);});
 o+=`<polyline points="${pts.map(p=>p[0]+','+p[1]).join(' ')}" fill="none" stroke="#0891b2" stroke-width="2.5"/>`;
 pts.forEach((p,i)=>{o+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="#0891b2"/><text x="${p[0]}" y="${p[1]-8}" text-anchor="middle" class="sg" font-size="9" font-weight="700" fill="#0891b2">${monthly[i][1]}</text>`;});
 return o+`</svg>`;}

 h+=`<div class="opp"><div class="oh">💡 Las 5 palancas genéricas — mucha vitrina, mala silla</div><div class="os">Alto volumen de impresiones en posición 6+: subirlas al top 3 es la conversión orgánica que hoy se paga en Ads.</div>`+

 /* ============ ② FICHAS DE PRODUCTO & MERCHANT ============ */
 h+=`<div class="seoh"><span class="n">2</span><h3>¿Cómo le va a las fichas de producto y Merchant?</h3><span class="sub">rich results, free listing y páginas de producto</span></div>`;

 h+=`<div class="mc"><div class="mcbox"><div class="t">Fichas Merchant · free listing <span class="tag org">SEO</span></div><div class="p">Solo <b>578 impresiones y 29 clics en 12 meses</b> — prácticamente apagado. Pero donde aparece rankea <b>#3,6</b> y convierte al <b>5,02%</b> (el mejor CTR de todo el sitio). Cada clic que no captura hoy se paga por Ads. Se enciende con títulos con keyword + atributos completos (GTIN, categoría, disponibilidad).</div></div><div class="mcbox"><div class="t">Fragmentos de producto · organic <span class="tag org">SEO</span></div><div class="p">Acá sí hay volumen: <b>208.505 impresiones</b> y 2.578 clics, pero a CTR 1,24% en posición 5,66. Las fichas <b>sí salen</b> masivamente en orgánico — están a media página 1. El feed limpio + reviews con schema las empuja al top 3.</div></div></div>`;

 h+=`<div class="opp"><div class="oh">🟠 Los 3 blogs a empujar</div><div class="os"><b>Magnesio</b> (22.530 impr, pos 8,1), <b>Electrolitos: qué son</b> (12.825 impr, pos 10,5) y <b>Creatina</b> (6.760 impr, pos 11,6) ya rankean pero en página 1-baja / página 2. Reescritura + enlazado interno + intención de búsqueda los mueve al top 5 y multiplica el CTR.</div></div>`;

function renderEmail(d){

function renderHist(){
 let h=`<div class="phead"><div><div class="pk">Histórico · qué se hizo y cómo se comportó</div><h2>La bitácora del cliente</h2></div></div>`;
 h+=CC.sessions.map(s=>`<details class="acc" ${s.mo.startsWith('Agosto')?'open':''}><summary><span class="mo">${s.mo}</span><span class="opt"><span class="obar"><i style="width:${s.opt}%"></i></span><span class="ov">${s.opt}%</span></span><span class="sm">${s.sum}</span></summary><div class="body"><div class="chgs"><div class="chg"><h5>🏢 Advanz ejecutó</h5><ul>`+s.advanz.map(a=>`<li><span class="e">${a[0]}</span>${a[1]}<span class="chip ${a[2]}">${a[2]==='done'?'hecho':a[2]==='wip'?'en curso':'plan'}</span></li>`).join('')+`</ul></div><div class="chg"><h5>🤝 Con / para el cliente</h5><ul>`+s.cliente.map(a=>`<li><span class="e">${a[0]}</span>${a[1]}<span class="chip ${a[2]}">${a[2]==='done'?'hecho':a[2]==='wip'?'en curso':'plan'}</span></li>`).join('')+`</ul></div></div></div></details>`).join('');
 h+=`<h3 class="sg" style="margin:24px 0 6px;font-size:16px;color:#12101a">Cobertura del histórico — los gaps</h3><div class="card"><div class="cs">Verde = cierre completo · Ámbar = parcial · Gris = por integrar</div><table class="cov"><tr><th></th>`+CC.months.map(m=>`<th>${CC.mlabel[m]} 26</th>`).join('')+`</tr>`;
 [["camp","Campañas"],["cro","CRO / Web"],["seo","SEO / GEO"],["email","Email & Flujos"]].forEach(c=>{h+=`<tr><td class="chn">${c[1]}</td>`+CC.months.map(m=>{const v=(CC.coverage[c[0]]||{})[m]||'none';return `<td><div class="cell ${v}">${v==='full'?'●':v==='part'?'◐':'○'}</div></td>`;}).join('')+`</tr>`;});
 h+=`</table></div><div class="note"><b>Gaps:</b> Ago es el único mes con los 4 canales; Campañas depende de conectar Google + volcar Meta a cada mes; SEO/Email tienen serie de datos pero reportes por mes parciales; CRO solo agosto. <b>Próximo:</b> barrer Ene–Jul + 2025 y volcar cada cierre y sus next-steps a la bitácora.</div>`;
 return h;

const TABS=[["resumen","💠","Rentabilidad",null,renderResumen],["camp","📣","Campañas","camp",renderCamp],["cro","🖱️","CRO","cro",renderCro],["seo","🌱","SEO / GEO","seo",renderSeo],["email","📧","Email","email",renderEmail],["hist","🗂️","Histórico",null,renderHist]];

function buildTabs(){document.getElementById('tabs').innerHTML=TABS.map(t=>{let sc='';if(t[3]&&CC.scores[t[3]]){const v=CC.scores[t[3]].s;sc=`<span class="sc ${scoreCls(v)}">${v}</span>`;}return `<button class="tab ${t[0]===cur?'on':''}" data-tab="${t[0]}"><span class="ic">${t[1]}</span>${t[2]}${sc}</button>`;}).join('');
 document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{cur=b.dataset.tab;render();});}
function render(){const md=CC.data[CC.current]||{};const t=TABS.find(x=>x[0]===cur);let html;
 if(t[0]==='hist')html=renderHist();else{const seg=md[t[0]==='resumen'?'resumen':t[0]];html=seg?t[4](seg):`<div class="pendbox"><span class="i">🗓️</span><div><b>Sin datos de este canal para el mes</b><div class="o">Cargalo con un prompt y aparece acá + en el histórico.</div></div></div>`;}
 document.getElementById('content').innerHTML=html;buildTabs();
 document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>{cur=el.dataset.go;render();});
 if(cur==='resumen')wireSim();if(cur==='email'||cur==='seo')mountReports();window.scrollTo(0,0);}
function mountReports(){document.querySelectorAll('iframe.rep').forEach(function(f){var id=f.getAttribute('data-rep');var el=document.getElementById('rep-'+id);if(!el||f.dataset.m)return;f.dataset.m='1';var html;try{html=JSON.parse(el.textContent);}catch(e){return;}
 try{var doc=f.contentWindow.document;doc.open();doc.write(html);doc.close();}catch(e){f.srcdoc=html;}
 var fit=function(){try{var h=f.contentWindow.document.documentElement.scrollHeight;if(h>300)f.style.height=(h+24)+'px';}catch(e){}};
 [200,600,1300,2400].forEach(function(t){setTimeout(fit,t);});});}
/* simulador live */
function wireSim(){const add=document.getElementById('add'),wa=document.getElementById('wa'),rev=document.getElementById('rev');if(!add)return;
 function calc(){const addM=parseFloat(add.value),extra=addM*1e6,ROAS=3.40,CPMclp=2.48*FX,CTR=0.0111,pop=0.049,leadVal=1500,waOn=+wa.value,revM=parseFloat(rev.value);
  const paidDirect=extra*ROAS;const sessions=CPMclp>0?extra/CPMclp*1000*CTR:0;const leads=sessions*pop;const flowUp=leads*leadVal;const waUp=waOn?sessions*0.094*0.35*0.20*33785:0;
  const totalUp=paidDirect+flowUp+waUp;const baseRev=revM*1e6;const newRev=baseRev+totalUp;const baseSpend=2.65e6;const newSpend=baseSpend+extra;const mer=newRev/newSpend;
  document.getElementById('s_add').textContent='+$'+addM.toFixed(1)+'M';document.getElementById('s_wa').textContent=waOn?'Sí':'No';document.getElementById('s_rev').textContent='$'+revM+'M';
  document.getElementById('simout').innerHTML=
   `<div class="orow"><span class="k">Ventas directas Meta (ROAS 3,4x)</span><span class="v">+$${(paidDirect/1e6).toFixed(1)}M</span></div>`+
   `<div class="orow"><span class="k">Arrastre en flujos (pop-up→bienvenida)</span><span class="v">+$${(flowUp/1e6).toFixed(2)}M</span></div>`+
   (waOn?`<div class="orow"><span class="k">Recuperación WhatsApp (checkout)</span><span class="v">+$${(waUp/1e6).toFixed(2)}M</span></div>`:'')+
   `<div class="orow big"><span class="k">Venta incremental estimada</span><span class="v">+$${(totalUp/1e6).toFixed(1)}M</span></div>`+
   `<div class="orow"><span class="k">MER blended proyectado</span><span class="v">${mer.toFixed(2)}x</span></div>`+
   `<div class="chain"><span>+$${addM.toFixed(1)}M inversión</span><span>→ ${NF(sessions)} sesiones</span><span>→ ${NF(leads)} leads pop-up</span><span>→ bienvenida + carrito</span></div>`;}
 [add,wa,rev].forEach(el=>el.oninput=calc);calc();}
render();
</script>

<script>

(function(){
 var BASE=(window.CC_API||'');
 var clp=function(n){return '$'+(Math.round(n/1e6*10)/10)+'M';};
 var nf=function(n){return Number(n).toLocaleString('es-CL');};
 window.__LIVE=null; window.__CRE=null; window.__CREloading=false;

  try{

   if(typeof cur!=='undefined' && cur==='resumen' && live && live.shopify && live.shopify.products && live.shopify.products.length){
    if(document.getElementById('cc-prodcard')) return;

    var card=document.createElement('div'); card.id='cc-prodcard'; card.className='card'; card.style.marginTop='16px';
    card.innerHTML='<div class="ct">🛒 Qué se vendió — top productos</div><div class="cs">Shopify · ventas del mes · en vivo</div><div class="cc-prod">'+rows+'</div>';
    content.appendChild(card);
   }
   if(typeof cur!=='undefined' && cur==='camp'){
    if(document.getElementById('cc-crecard')) return;
    var card2=document.createElement('div'); card2.id='cc-crecard'; card2.className='card'; card2.style.marginTop='16px';
    card2.innerHTML='<div class="ct">🖼️ Creativos por rendimiento</div><div class="cs">Meta · top anuncios por inversión del mes</div><div class="cc-cre" id="cc-cregrid"><div style="color:var(--muted);font-size:13px">Cargando creativos…</div></div>';
    content.appendChild(card2);
    loadCreatives();
   }
  }catch(e){}
 }
 async function loadCreatives(){
  var grid=document.getElementById('cc-cregrid'); if(!grid) return;
  try{
   if(!window.__CRE){ if(window.__CREloading) return; window.__CREloading=true;
    var r=await fetch(BASE+'/api/meta-creatives?month='+encodeURIComponent(CC.current));
    window.__CRE = r.ok ? (await r.json()) : {creatives:[]}; window.__CREloading=false; }
   var cs=(window.__CRE&&window.__CRE.creatives)||[];
   if(!cs.length){ grid.innerHTML='<div style="color:var(--muted);font-size:13px">Sin creativos en vivo (configurá Meta en el Worker) — el snapshot del canal sigue disponible.</div>'; return; }
   grid.innerHTML=cs.map(function(c){return '<div class="cc-card">'+
     (c.thumb?'<img class="im" src="'+c.thumb+'" alt="">':'<div class="im"></div>')+
     '<div class="bd"><div class="nm">'+(c.name||'')+'</div><div class="mt">'+
     (c.roas!=null?'<span class="chip2 g">ROAS '+c.roas+'x</span>':'')+
     (c.ctr!=null?'<span class="chip2">CTR '+c.ctr+'%</span>':'')+
     '<span class="chip2">$'+nf(c.spend_clp)+'</span></div></div></div>';}).join('');
  }catch(e){ if(grid) grid.innerHTML='<div style="color:var(--muted);font-size:13px">No se pudieron cargar los creativos.</div>'; }
 }
 async function hydrate(){
  try{
   var r=await fetch(BASE+'/api/all?month='+encodeURIComponent(CC.current)); if(!r.ok){wrap();return;}
   var d=await r.json(); if(!d||!d.ok){wrap();return;} window.__LIVE=d; var md=CC.data[CC.current]; if(!md){wrap();return;}
   if(d.meta&&!d.meta.error){var m=d.meta; md.campanas.kpis=[
     {l:'Inversión (Meta)',v:clp(m.spend_clp),s:'US$'+nf(Math.round(m.spend_usd))+' · en vivo',d:'nt'},
     {l:'Purchase ROAS',v:(m.roas||0).toFixed(2)+'x',s:'sobre breakeven',d:'up'},
     {l:'Compras',v:nf(m.purchases),s:'costo US$'+(m.cpa_usd||'—'),d:'nt'},
     {l:'Alcance',v:nf(m.reach),s:nf(m.impressions)+' impresiones',d:'nt'},
     {l:'CTR',v:(m.ctr||'—')+'%',s:'CPM US$'+(m.cpm_usd||'—'),d:'nt'},
     {l:'Ventas (in-platform)',v:clp(m.sales_clp),s:'ROAS × inversión',d:'up'}];}
   if(d.google&&!d.google.error){md.campanas.google=false;
     md.campanas.kpis.push({l:'Google Ads',v:clp(d.google.spend_clp),s:'ROAS '+(d.google.roas||'—')+'x · en vivo',d:'up'});}
   if(d.klaviyo&&!d.klaviyo.error){var k=d.klaviyo;
