<style>
  .cx { font-family: var(--font-anthropic-sans); display: flex; flex-direction: column; gap: var(--cds-gap-xl); }
  .cx-title { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--cds-font-size-title); margin: 0; text-wrap: balance; }
  .cx-sub { margin: var(--cds-gap-xs) 0 0; color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
  .cx-h2 { margin: 0 0 var(--cds-gap-sm); font-size: var(--cds-font-size-heading); font-weight: var(--cds-font-weight-medium); }
  .cx-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 11rem), 1fr)); gap: var(--cds-gap-md); }
  .cx-tile, .cx-card { background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-md) var(--cds-pad-lg); display: flex; flex-direction: column; gap: var(--cds-gap-xs); min-width: 0; }
  .cx-tile-name { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
  .cx-tile-val { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--cds-font-size-title); font-variant-numeric: tabular-nums; min-height: 1.3em; }
  .cx-row { display: flex; flex-wrap: wrap; gap: var(--cds-gap-sm); align-items: center; font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
  .cx-chip { display: inline-block; padding: 0 var(--cds-pad-sm); border-radius: 999px; border: 1px solid var(--color-border-line); font-size: var(--cds-font-size-caption); line-height: 1.6; white-space: nowrap; }
  .cx-chip[data-s="ok"] { color: var(--color-ok); }
  .cx-chip[data-s="warn"], .cx-chip[data-s="ok-needed"] { color: var(--color-warn); }
  .cx-chip[data-s="bad"], .cx-chip[data-s="bloqueado"], .cx-chip[data-s="sin-conector"], .cx-chip[data-s="sin-plan"] { color: var(--color-bad); }
  .cx-chip[data-s="sin-dato"], .cx-chip[data-s="sin-probar"] { color: var(--color-fg-muted); }
  .cx-list { display: flex; flex-direction: column; gap: var(--cds-gap-md); }
  .cx-fuga-top { display: flex; gap: var(--cds-gap-md); align-items: baseline; }
  .cx-sev { font-family: var(--font-anthropic-serif); font-size: var(--cds-font-size-heading); font-variant-numeric: tabular-nums; min-width: 1.2em; }
  .cx-sev[data-v="5"], .cx-sev[data-v="4"] { color: var(--color-bad); }
  .cx-sev[data-v="3"] { color: var(--color-warn); }
  .cx-fuga-title { font-weight: var(--cds-font-weight-medium); }
  .cx-fuga-acc { color: var(--color-fg); }
  .cx-muted { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
  .cx-scroll { overflow-x: auto; }
  .cx-table { width: 100%; border-collapse: collapse; font-size: var(--cds-font-size-body); }
  .cx-table th { text-align: left; font-weight: var(--cds-font-weight-medium); font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); padding: var(--cds-pad-xs) var(--cds-pad-sm); border-bottom: 1px solid var(--color-border-line); white-space: nowrap; }
  .cx-table td { padding: var(--cds-pad-sm); border-bottom: 1px solid var(--color-border-line); vertical-align: top; }
  .cx-table tr:last-child td { border-bottom: 0; }
  .cx-nowrap { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .cx-fail { display: flex; align-items: center; justify-content: center; gap: var(--cds-gap-sm); color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); min-height: 3rem; }
  .cx-fail::before { content: ""; width: .375rem; height: .375rem; border-radius: 50%; background: var(--color-bad); }
  .cx-empty { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
  details.cx-done summary { cursor: pointer; color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
  @media (max-width: 640px) { .cx-hide-narrow { display: none; } }
</style>

<div class="cx">
  <header id="encabezado">
    <h1 class="cx-title">Email OS · Advanz</h1>
    <p class="cx-sub">Outbound, nurturing y CRM propios de Advanz · datos al <span data-source="fecha" data-field="actualizado" class="dash-skeleton">—</span></p>
  </header>

  <section id="kpis" aria-label="KPIs">
    <div class="cx-tiles">
      <div class="cx-tile" data-kpi="diag_vercel"></div>
      <div class="cx-tile" data-kpi="diag_enviados"></div>
      <div class="cx-tile" data-kpi="reply_rate"></div>
      <div class="cx-tile" data-kpi="agendas"></div>
    </div>
  </section>

  <section id="que-hacer">
    <h2 class="cx-h2">Qué hacer ahora</h2>
    <div class="cx-list" id="fugas-list"></div>
    <details class="cx-done" id="fugas-done" hidden><summary>Resueltas</summary><div class="cx-list" id="fugas-done-list"></div></details>
  </section>

  <section id="pedidos">
    <h2 class="cx-h2">Pedidos de otros OS</h2>
    <div class="cx-card cx-scroll" id="handoffs-box">
      <table class="cx-table" data-source="handoffs" data-row-key="pedido">
        <thead><tr><th data-field="fecha">Fecha</th><th data-field="de">De</th><th data-field="pedido">Pedido</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section id="accesos">
    <h2 class="cx-h2">Accesos</h2>
    <div class="cx-card cx-scroll" id="accesos-box">
      <table class="cx-table" data-source="accesos" data-row-key="conector">
        <thead><tr><th data-field="conector">Conector</th><th data-field="estado">Estado</th><th data-field="nota">Nota</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section id="cambios">
    <h2 class="cx-h2">Últimos cambios</h2>
    <div class="cx-card cx-scroll" id="cambios-box">
      <table class="cx-table" data-source="cambios" data-row-key="cambio">
        <thead><tr><th data-field="fecha">Fecha</th><th data-field="cambio">Cambio</th><th data-field="revertir" class="cx-hide-narrow">Cómo revertir</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</div>

<script>
dash.calc('fecha', {
  inputs: ['kpis'],
  title: 'Fecha de los datos',
  description: 'La fecha de actualización más reciente entre los KPIs.',
  fn: (kpis) => ({ actualizado: kpis.map(k => String(k.actualizado || '')).sort().pop() || '' })
});

const fmt = (v, unidad) => {
  if (v === null || v === undefined || v === '') return '—';
  const n = Number(v);
  return Number.isFinite(n) ? d3.format(',')(n) + (unidad === '%' ? '%' : '') : String(v);
};
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
const mark = (e, src, field, where) => { e.setAttribute('data-source', src); e.setAttribute('data-field', field); if (where) e.setAttribute('data-where', where); return e; };
const fail = (box) => { box.replaceChildren(el('div', 'cx-fail', 'Failed to load')); };

function drawKpis() {
  const r = dash.data('kpis');
  document.querySelectorAll('[data-kpi]').forEach(tile => {
    const id = tile.dataset.kpi, w = 'id=' + encodeURIComponent(id);
    tile.replaceChildren();
    const name = mark(el('div', 'cx-tile-name', '—'), 'kpis', 'nombre', w);
    const val = mark(el('div', 'cx-tile-val', '—'), 'kpis', 'valor', w);
    const foot = el('div', 'cx-row');
    tile.append(name, val, foot);
    if (r.status === 'error') { val.className = 'cx-fail'; val.textContent = 'Failed to load'; return; }
    if (r.status !== 'ok') { val.classList.add('dash-skeleton'); return; }
    const k = r.data.find(x => x.id === id);
    if (!k) return;
    name.textContent = k.nombre;
    val.textContent = fmt(k.valor, k.unidad);
    const chip = mark(el('span', 'cx-chip', k.estado), 'kpis', 'estado', w); chip.dataset.s = k.estado;
    foot.appendChild(chip);
    if (k.meta !== null && k.meta !== undefined) {
      const m = el('span', '', 'meta ');
      m.appendChild(mark(el('span', '', fmt(k.meta, k.unidad)), 'kpis', 'meta', w));
      foot.appendChild(m);
    }
    foot.appendChild(mark(el('span', '', k.periodo), 'kpis', 'periodo', w));
  });
}

function fugaCard(f) {
  const w = 'id=' + encodeURIComponent(f.id);
  const card = el('article', 'cx-card');
  const top = el('div', 'cx-fuga-top');
  const sev = mark(el('span', 'cx-sev', String(f.severidad)), 'fugas', 'severidad', w); sev.dataset.v = String(f.severidad);
  const tt = el('div');
  tt.append(mark(el('div', 'cx-fuga-title', f.titulo), 'fugas', 'titulo', w));
  tt.append(mark(el('div', 'cx-fuga-acc', f.accion), 'fugas', 'accion', w));
  top.append(sev, tt);
  const row = el('div', 'cx-row');
  const ej = el('span', '', 'ejecuta ');
  ej.appendChild(mark(el('span', '', f.ejecuta), 'fugas', 'ejecuta', w));
  row.appendChild(ej);
  if (f.requiere_ok === true || f.requiere_ok === 'true') {
    const ok = el('span', 'cx-chip', 'Necesita tu OK'); ok.dataset.s = 'ok-needed';
    row.appendChild(ok);
  }
  const ac = mark(el('span', 'cx-chip', f.acceso), 'fugas', 'acceso', w); ac.dataset.s = f.acceso;
  row.appendChild(ac);
  row.appendChild(mark(el('span', 'cx-muted', f.estado), 'fugas', 'estado', w));
  row.appendChild(mark(el('span', 'cx-muted', f.id), 'fugas', 'id', w));
  card.append(top, row);
  if (f.evidencia) card.appendChild(mark(el('div', 'cx-muted', f.evidencia), 'fugas', 'evidencia', w));
  return card;
}

function drawFugas() {
  const r = dash.data('fugas');
  const list = document.getElementById('fugas-list');
  const done = document.getElementById('fugas-done');
  const doneList = document.getElementById('fugas-done-list');
  list.replaceChildren(); doneList.replaceChildren();
  if (r.status === 'error') { fail(list); done.hidden = true; return; }
  if (r.status !== 'ok') { list.appendChild(el('div', 'cx-card dash-skeleton')); done.hidden = true; return; }
  const rows = r.data.slice().sort((a, b) => Number(b.severidad) - Number(a.severidad));
  const vivas = rows.filter(f => f.estado !== 'resuelta');
  const resueltas = rows.filter(f => f.estado === 'resuelta');
  vivas.forEach(f => list.appendChild(fugaCard(f)));
  if (!vivas.length) list.appendChild(el('div', 'cx-empty', 'No hay fugas abiertas.'));
  resueltas.forEach(f => doneList.appendChild(fugaCard(f)));
  done.hidden = resueltas.length === 0;
}

function drawTable(id, boxId, cols, prep) {
  const r = dash.data(id);
  const box = document.getElementById(boxId);
  const table = box.querySelector('table');
  box.querySelectorAll('.cx-fail, .cx-empty').forEach(n => n.remove());
  const tbody = table.querySelector('tbody');
  tbody.replaceChildren();
  table.hidden = false;
  if (r.status === 'error') { table.hidden = true; box.appendChild(el('div', 'cx-fail', 'Failed to load')); return; }
  if (r.status !== 'ok') { tbody.classList.add('dash-skeleton'); return; }
  tbody.classList.remove('dash-skeleton');
  const rows = prep ? prep(r.data.slice()) : r.data;
  if (!rows.length) { table.hidden = true; box.appendChild(el('div', 'cx-empty', 'Sin pedidos abiertos.')); return; }
  rows.forEach(row => {
    const tr = document.createElement('tr');
    cols.forEach(c => { const td = el('td', c.cls); c.draw(td, row); tr.appendChild(td); });
    tbody.appendChild(tr);
  });
}

const prioridadAcceso = { 'bloqueado': 0, 'sin-conector': 1, 'sin-plan': 2, 'sin-probar': 3, 'ok': 4 };
const chipCell = (field) => (td, row) => { const c = el('span', 'cx-chip', row[field]); c.dataset.s = row[field]; td.appendChild(c); };
const textCell = (field) => (td, row) => { td.textContent = row[field] == null ? '' : String(row[field]); };

dash.onData(() => {
  const fe = dash.data('fecha');
  document.querySelectorAll('[data-source="fecha"]').forEach(n => {
    if (fe.status === 'ok') { n.classList.remove('dash-skeleton'); n.textContent = fe.data.actualizado || '—'; } else { n.textContent = '—'; }
  });
  drawKpis();
  drawFugas();
  drawTable('handoffs', 'handoffs-box', [
    { cls: 'cx-nowrap', draw: textCell('fecha') }, { cls: 'cx-nowrap', draw: textCell('de') }, { draw: textCell('pedido') }
  ]);
  drawTable('accesos', 'accesos-box', [
    { draw: textCell('conector') }, { draw: chipCell('estado') }, { draw: textCell('nota') }
  ], rows => rows.sort((a, b) => (prioridadAcceso[a.estado] ?? 5) - (prioridadAcceso[b.estado] ?? 5)));
  drawTable('cambios', 'cambios-box', [
    { cls: 'cx-nowrap', draw: textCell('fecha') }, { draw: textCell('cambio') }, { cls: 'cx-hide-narrow', draw: textCell('revertir') }
  ], rows => rows.sort((a, b) => String(b.fecha).localeCompare(String(a.fecha))).slice(0, 10));
});
</script>
